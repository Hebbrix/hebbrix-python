name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

concurrency:
  group: publish-python-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install --upgrade build twine

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$PACKAGE_VERSION" = "$REQUESTED_VERSION"

      - name: Build and inspect distributions
        run: |
          python -m compileall -q hebbrix
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/hebbrix-${{ inputs.version }}-py3-none-any.whl
          python -c 'import hebbrix; assert hebbrix.__version__ == "${{ inputs.version }}"'

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
