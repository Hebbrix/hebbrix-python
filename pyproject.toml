[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hebbrix"
version = "2.6.0rc3"
description = "Typed Python client for Hebbrix memory, retrieval, and outcome-learning APIs"
readme = "README.md"
requires-python = ">=3.8"
# Keep source installation compatible with Python 3.8's setuptools release.
license = {file = "LICENSE"}
authors = [
    {name = "Hebbrix Team", email = "support@hebbrix.com"}
]
maintainers = [
    {name = "Hebbrix Team", email = "support@hebbrix.com"}
]
keywords = [
    "ai",
    "memory",
    "agents",
    "llm",
    "chatbot",
    "assistant",
    "ml",
    "reinforcement-learning",
    "knowledge-graph",
    "vector-search",
    "rag",
    "temporal",
    "procedural-memory",
    "working-memory"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.31.0",
]

[project.scripts]
hebbrix-reflect = "hebbrix.reflection_worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=5.0.4,<6.0.0; python_full_version < '3.8.1'",
    "flake8>=6.0.0; python_full_version >= '3.8.1'",
    "mypy>=1.0.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://hebbrix.com"
Documentation = "https://docs.hebbrix.com"
Source = "https://github.com/Hebbrix/hebbrix-python"
Issues = "https://github.com/Hebbrix/hebbrix-python/issues"
Support = "https://www.hebbrix.com/contact"
"API Reference" = "https://api.hebbrix.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["hebbrix*"]
exclude = ["tests*", "memory_ai*", "memory_ai_sdk*"]
